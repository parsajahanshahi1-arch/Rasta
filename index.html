<title>حسابداری رستا</title>
<style>
:root{--bg:#FBF3F6;--card:#fff;--plum:#4E2342;--pt:#4E2342;--rose:#C2557A;--blush:#F6E3EA;--ink:#2A1A24;--mut:#7d6672;--warn:#B3261E;--ok:#2E7D5B;--font:"Vazirmatn",Tahoma,"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,a,.lnk,select{touch-action:manipulation}
button{-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
body{overscroll-behavior-y:none;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);padding-bottom:160px}
header{position:relative;background:var(--plum);color:#fff;padding:20px 20px 18px;border-radius:0 0 26px 26px}
header h1{margin:0;font-size:1.35rem}header p{margin:4px 0 0;opacity:.8;font-size:.9rem}
.hm{position:absolute;left:14px;top:16px;width:44px;height:44px;border:0;border-radius:14px;background:rgba(255,255,255,.14);color:#fff;font-size:1.5rem;cursor:pointer}
main{padding:16px;display:grid;gap:12px;max-width:640px;margin:0 auto}
.srch{display:none;max-width:640px;margin:14px auto 0;padding:0 16px}.srch.on{display:block}
.sf{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:0 14px;box-shadow:0 2px 10px rgba(78,35,66,.07)}
.sf input{background:none;border:0;margin:0;padding:13px 4px}
.empty{background:var(--card);border-radius:20px;padding:26px 20px;color:var(--mut);text-align:center;line-height:1.9}
.c{position:relative;background:var(--card);border-radius:20px;padding:16px;box-shadow:0 2px 10px rgba(78,35,66,.07)}
.c h2{margin:0;font-size:1.1rem;padding-right:42px;overflow-wrap:anywhere}

const P="۰۱۲۳۴۵۶۷۸۹";
let db={suppliers:[],products:[],purchases:[],hist:[],orders:[]},tab="p",cart=null,rs=null,bv=null,iv=null,sv=null,scanKind="",stTab="s",stKind="c",kq="",lastTab=null,fxNext=false,mt=0,et=0,askEl=null;
try{const s=localStorage.getItem("resta");if(s)db=Object.assign(db,JSON.parse(s))}catch(e){}
db.products.forEach(p=>{if(!p.variants)p.variants=[{color:p.color||"",size:p.size||"",qty:p.stock||0}];if(p.sell==null)p.sell=p.buy||0});
db.purchases.forEach(p=>{if(!p.items)p.items=[{pid:p.pid,name:p.name,qty:p.qty,unit:p.unit}]});
if(!db.hist.length)db.purchases.forEach(p=>db.hist.push({id:p.id,type:"buy",date:p.date,time:"",title:"خرید",lines:p.items.map(i=>i.name+" — "+i.qty+" عدد"),total:p.total}));
let memWarned=false;
const save=()=>{fxNext=true;try{const j=JSON.stringify(db);localStorage.setItem("resta",j);if(j.length>4.2e6&&!memWarned){memWarned=true;toast("عکس‌ها دارن حافظه رو پر می‌کنن. از تنظیمات پشتیبان بگیر.")}}catch(e){toast("حافظه‌ی مرورگر پر شده و ذخیره نشد! عکس‌های کالا رو کم کن.")}};
db.shop=db.shop||{name:"رستا",phone:"",addr:""};db.seq=db.seq||0;db.part=db.part||{};
const mq=matchMedia("(prefers-color-scheme: dark)");
function applyTheme(){const m=db.theme||"auto",d=m==="dark"||(m==="auto"&&mq.matches);document.documentElement.dataset.theme=d?"dark":"light";$("tc").content=d?"#5B2650":"#4E2342"}
mq.addEventListener&&mq.addEventListener("change",applyTheme);
db.orders.slice().reverse().forEach(o=>{if(!o.no)o.no=++db.seq});
const nd=s=>String(s).replace(/[۰-۹]/g,d=>P.indexOf(d));
const fa=s=>String(s);
const num=s=>{s=nd(s).replace(/[,٬\s]/g,"").replace("٫",".");return s===""?NaN:Number(s)};
const money=n=>Math.round(n).toLocaleString("en-US")+" تومان";
const f0=n=>Math.round(n).toLocaleString("en-US");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nk=x=>String(x||"").trim().toLowerCase();
const sTxt=x=>nd(x).toLowerCase().replace(/ي/g,"ی").replace(/ك/g,"ک");
const vl=v=>[v.color,v.size].filter(Boolean).join(" ")||"بدون مشخصات";
const fmtN=v=>{if(/[%٪]/.test(String(v)))return String(v);const n=num(String(v));return v===""||!isFinite(n)?"":fa(Math.round(n).toLocaleString("en-US"))};
function short(v){const n=Math.round(num(String(v)));if(!isFinite(n)||n<=0)return"";const m=Math.floor(n/1e6),k=Math.floor(n%1e6/1e3),r=n%1e3,p=[];if(m)p.push(fa(m)+" میلیون");if(k)p.push(fa(k)+" هزار");if(r)p.push(fa(r));return p.join(" و ")+" تومان"}
function toJ(gy,gm,gd){
  const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];
  let jy=gy<=1600?0:979;gy-=gy<=1600?621:1600;
  const gy2=gm>2?gy+1:gy;
  let days=365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+gdm[gm-1];
  jy+=33*Math.floor(days/12053);days%=12053;
  jy+=4*Math.floor(days/1461);days%=1461;
  if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}
  const jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30);
  const jd=1+(days<186?days%31:(days-186)%30);
  return [jy,jm,jd];
}
function today(){const d=new Date(),j=toJ(d.getFullYear(),d.getMonth()+1,d.getDate());return `${j[0]}/${String(j[1]).padStart(2,"0")}/${String(j[2]).padStart(2,"0")}`}
function addM(d,k){let [y,m,dd]=nd(d).split("/").map(Number);m+=k;y+=Math.floor((m-1)/12);m=(m-1)%12+1;dd=Math.min(dd,m<=6?31:m<=11?30:29);return `${y}/${String(m).padStart(2,"0")}/${String(dd).padStart(2,"0")}`}
const ymKey=d=>d.slice(0,7);
function toG(jy,jm,jd){
  jy+=1595;
  let days=-355668+365*jy+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);
  let gy=400*Math.floor(days/146097);days%=146097;
  if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++}
  gy+=4*Math.floor(days/1461);days%=1461;
  if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}
  let gd=days+1;
  const sal=[0,31,(gy%4===0&&gy%100!==0)||gy%400===0?29:28,31,30,31,30,31,31,30,31,30,31];
  let gm=0;while(gm<13&&gd>sal[gm]){gd-=sal[gm];gm++}
  return [gy,gm,gd];
}
function daysLate(due){
  const [y,m,d]=nd(due).split("/").map(Number),[gy,gm,gd]=toG(y,m,d),n=new Date();
  return Math.floor((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())-Date.UTC(gy,gm-1,gd))/864e5);
}
function lateStr(due){
  const d=daysLate(due);if(d<=0)return"";
  const t=d<30?`${fa(d)} روز`:`${fa(Math.floor(d/30))} ماه${d%30?" و "+fa(d%30)+" روز":""}`;
  return `از روز پرداخت قسط ${t} گذشته و پرداخت نشده`;
}
const supName=id=>(db.suppliers.find(s=>s.id===id)||{}).name||"—";
const stock=p=>p.variants.reduce((a,v)=>a+v.qty,0);
const sellOf=p=>p.sell!=null?p.sell:(p.buy||0);
function log(type,title,lines,total,date){db.hist.unshift({id:Date.now()+Math.random(),type,date:date||today(),time:new Date().toTimeString().slice(0,5),title,lines,total})}
/* installments */
function rnd(n){const st=n<100000?1000:n<10000000?10000:100000;return Math.round(n/st)*st}
function calcInst(total,m){if(m===1)return{monthly:total,last:total};let mo=rnd(total/m);if(mo<=0||mo*(m-1)>=total)mo=Math.floor(total/m);return{monthly:mo,last:total-mo*(m-1)}}
const act=o=>o.inst&&o.inst.paid<o.inst.months;
const dueOf=o=>addM(o.inst.start,o.inst.paid);
const instAmt=(o,n)=>n>=o.inst.months?o.inst.last:o.inst.monthly;
const remain=o=>{let r=0;for(let n=o.inst.paid+1;n<=o.inst.months;n++)r+=instAmt(o,n);return r};
const paidSum=o=>!o.inst?o.total:(o.inst.paid>=o.inst.months?o.total:(o.pre||0)+o.inst.monthly*o.inst.paid);
const ratio=o=>o.total>0?paidSum(o)/o.total:1;
const ordProfit=o=>o.items.reduce((a,i)=>a+(i.price-(i.cost??i.price))*i.qty,0)-(o.disc||0);
const sgn=v=>(v>=0?"+":"−")+f0(Math.abs(v));
function profitSplit(){let c=0,n=0;db.orders.forEach(o=>{const p=ordProfit(o)*ratio(o);o.inst?n+=p:c+=p});return{c,n}}
function people(){
  const m=new Map();
  db.orders.filter(act).forEach(o=>{const k=nk(o.buyer),p=m.get(k)||{key:k,name:o.buyer||"بدون نام",plans:[]};p.plans.push(o);m.set(k,p)});
  return [...m.values()].map(p=>({...p,remain:Math.max(0,p.plans.reduce((a,o)=>a+remain(o),0)-((db.part[p.key]||{}).amt||0)),monthly:p.plans.reduce((a,o)=>a+o.inst.monthly,0),due:p.plans.map(dueOf).sort()[0]})).sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0);
}
const curAmt=ps=>{const ym=ymKey(ps.due);return ps.plans.filter(o=>ymKey(dueOf(o))===ym).reduce((a,o)=>a+instAmt(o,o.inst.paid+1),0)};
function step(ps){
  const ym=ymKey(ps.due),lines=[];let amt=0;
  ps.plans.forEach(o=>{if(ymKey(dueOf(o))===ym){const n=o.inst.paid+1;amt+=instAmt(o,n);o.inst.paid=n;lines.push(`${o.items.map(i=>i.name).join("، ")} — قسط ${fa(n)} از ${fa(o.inst.months)}${n>=o.inst.months?" (تسویه شد)":""}`)}});
  log("pay","پرداخت قسط — "+ps.name,lines,amt);db.hist[0].buyer=ps.name;return amt;
}
function payMonth(key){
  const ps=people().find(p=>p.key===key);if(!ps)return;
  step(ps);delete db.part[key];save();
}
function addReceipt(key,v){
  let ps=people().find(p=>p.key===key);if(!ps)return;
  const p=db.part[key]||(db.part[key]={amt:0,list:[]});
  p.amt+=v;log("pay","دریافت از "+ps.name,[],v);db.hist[0].buyer=ps.name;p.list.push({d:today(),a:v,h:db.hist[0].id});
  if(p.amt>=curAmt(ps)){step(ps);delete db.part[key]}
  save();
}
function buyerList(){
  const m=new Map();
  db.orders.forEach(o=>{const k=nk(o.buyer),b=m.get(k)||{key:k,name:o.buyer||"بدون نام",phone:"",orders:[],total:0,act:false};b.orders.push(o);b.total+=o.total||0;if(act(o))b.act=true;if(!b.phone&&o.phone)b.phone=o.phone;m.set(k,b)});
  return [...m.values()];
}
const planBlock=o=>o.inst.paid>=o.inst.months
  ?`<div class="pl"><div class="pn"><b>تسویه شد ✓</b> (${fa(o.inst.months)} قسط)</div><div class="bt big"><i style="width:100%"></i></div><small>${esc(o.items.map(i=>i.name).join("، "))}</small></div>`
  :`<div class="pl"><div class="pn"><b>${fa(o.inst.paid)} از ${fa(o.inst.months)}</b> قسط پرداخت شده</div><div class="bt big"><i style="width:${o.inst.paid/o.inst.months*100}%"></i></div><small>${esc(o.items.map(i=>i.name).join("، "))} · ماهی ${f0(o.inst.monthly)} تومان</small></div>`;
const notifs=()=>people().filter(p=>daysLate(p.due)>0);
function updBell(){const n=notifs().length,e=$("nb");e.hidden=!n;e.textContent=fa(n)}
function openBell(){
  const ns=notifs();
  openM(`<h3>اعلان‌ها</h3>`+(ns.length?ns.map(p=>`<div class="vr lnk" data-buyer="${esc(p.name)}"><span><b>${esc(p.name)}</b> قسطش رو پرداخت نکرده<small style="color:var(--warn);font-weight:700">${esc(lateStr(p.due).replace("از روز پرداخت قسط ","").replace(" گذشته و پرداخت نشده"," از موعد قسط گذشته"))}</small></span><span>‹</span></div>`).join(""):`<p style="text-align:center;color:var(--mut);padding:22px 0">اعلانی ندارید 🔔</p>`)+`<div class="acts" style="margin-top:12px"><button class="b g" onclick="closeM()">بستن</button></div>`);
}
function delOrder(id){
  const o=db.orders.find(x=>x.id===id);
  if(o)o.items.forEach(i=>{const p=db.products.find(x=>x.id===i.pid);if(!p)return;i.rows.forEach(r=>{const v=p.variants.find(x=>x.color===r.color&&x.size===r.size);v?v.qty+=r.qty:p.variants.push({color:r.color,size:r.size,qty:r.qty});p.sold=Math.max(0,(p.sold||0)-r.qty)})});
  db.orders=db.orders.filter(x=>x.id!==id);db.hist=db.hist.filter(h=>h.id!==id);
}
function contactBtns(ps){
  const ph=phoneOf(ps.name);if(!ph)return"";
  const due=ymKey(ps.due)<=ymKey(today()),msg=`سلام ${ps.name} عزیز 🌸\nیادآوری قسط فروشگاه ${db.shop.name||""}: مبلغ ${f0(ps.monthly)} تومان سررسید شده. ممنون از لطفتون.`;
  return `<div class="acts"><a class="b g sm" style="flex:1" href="tel:${esc(nd(ph))}">📞 تماس</a>${due?`<a class="b g sm" style="flex:1" href="sms:${esc(nd(ph))}?body=${encodeURIComponent(msg)}">💬 پیام یادآوری</a>`:""}</div>`;
}
const payBlock=ps=>ymKey(ps.due)<=ymKey(today())
  ?`<button class="b sm" style="width:100%" data-pay="${esc(ps.key)}">قسط این ماه پرداخت شد ✓</button>`
  :`<p class="okp">${ps.plans.some(o=>o.inst.paid>0)?"این ماه پرداخت شده ✓ — قسط بعدی: ":"سررسید قسط اول: "}${fa(ps.due)}</p>`;

function render(){
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===(tab==="b"||tab==="s"?"p":tab)));
  $("add").style.display=tab==="s"||tab==="b"?"block":"none";
  $("sbar").classList.toggle("on",tab==="k");
  const L=$("list");L.classList.toggle("fx",lastTab!==tab||fxNext);lastTab=tab;fxNext=false;
  let h="";
  if(tab==="p"){
    $("sub").textContent="خرید و فروش";
    h=`<div class="home"><div class="hc"><div><span class="hi">🏬</span><h2>خرید</h2></div><button class="hbn red" data-go="s">ثبت</button></div>
    <div class="hc"><div><span class="hi">🛍️</span><h2>فروش</h2></div><button class="hbn green" data-go="b">ثبت</button></div></div>${bkCard()}`;
  }else if(tab==="b"){
    const bl=buyerList();$("sub").textContent=`${fa(bl.length)} خریدار`;
    h=`<button class="ch" data-go="p" style="justify-self:start">→ خانه</button>`
    +bl.map(b=>`<article class="c h lnk" data-buyer="${esc(b.name)}"><h2>${esc(b.name)} ‹ ${b.act?`<span class="bd">قسطی</span>`:""}</h2><p>${b.phone?esc(b.phone)+" · ":""}${fa(b.orders.length)} خرید · مجموع ${f0(b.total)} تومان</p><button class="b sm" style="width:100%;background:#2E9E5B" data-again="${esc(b.name)}">🛍️ خرید دوباره</button></article>`).join("");
    if(!bl.length)h+='<div class="empty">هنوز خریداری ثبت نشده.<br>با دکمه‌ی + اولین خریدار رو ثبت کن.</div>';
  }else if(tab==="k"){
    $("sub").textContent=`${fa(db.products.filter(p=>stock(p)>0).length)} کالا در انبار`;
    const q=sTxt(kq).trim(),ps=db.products.filter(p=>stock(p)>0&&(!q||sTxt([p.name,p.cat,p.code,...p.variants.map(vl)].join(" ")).includes(q)));
    h=ps.map(p=>`<article class="c lnk" data-prod="${p.id}"><button class="x" data-del="k" data-id="${p.id}" aria-label="حذف">×</button><button class="ex" data-edit="k" data-id="${p.id}" aria-label="ویرایش">✏️</button><h2>${p.noProfit?'<span class="dot" aria-label="سود ثبت نشده"></span>':""}${esc(p.name)}</h2>
      <p>${[p.cat,p.code,"خرید: "+f0(p.buy||0)].filter(Boolean).map(esc).join(" · ")}</p>${p.noProfit?'<p class="nop">قیمت فروش (با سود) هنوز ثبت نشده</p>':""}
      <div class="st"><div><span>موجودی</span><b>${fa(stock(p))}</b></div><div><span>قیمت فروش</span><b>${f0(sellOf(p))}</b></div><div><span>فروخته‌شده</span><b>${fa(p.sold||0)}</b></div></div>
      ${p.img?`<div class="prw"><img class="pi" src="${p.img}" alt="${esc(p.name)}">`:""}<div class="chips"${p.img?' style="margin-top:0;flex:1;align-content:flex-start"':""}>${p.variants.filter(v=>v.qty>0).map(v=>`<i>${esc(vl(v))}: ${fa(v.qty)}</i>`).join("")}</div>${p.img?"</div>":""}
      <button class="b sm" data-sale="${p.id}"${stock(p)?"":" disabled"}>ثبت فروش</button></article>`).join("");
    if(!h)h=`<div class="empty">${q?"چنین کالایی وجود ندارد.":"انبار خالیه.<br>کالا رو از «فروشنده‌ها» یا با اسکن فاکتور (📷) اضافه کن."}</div>`;
  }else if(tab==="s"){
    $("sub").textContent=`${fa(db.suppliers.length)} فروشنده`;
    h=`<button class="ch" data-go="p" style="justify-self:start">→ خانه</button>`+db.suppliers.map(s=>{
      const mine=db.purchases.filter(p=>p.sup===s.id);
      return `<article class="c lnk" data-supp="${s.id}"><button class="x" data-del="s" data-id="${s.id}" aria-label="حذف">×</button><button class="ex" data-edit="s" data-id="${s.id}" aria-label="ویرایش">✏️</button>
      <h2>${esc(s.name)} ‹</h2><p>${esc(s.person||"")}${s.phone?` · <a href="tel:${esc(nd(s.phone))}">${esc(s.phone)}</a>`:""}</p>
      <div class="st" style="grid-template-columns:1fr 1fr"><div><span>تعداد خرید</span><b>${fa(mine.filter(p=>!p.ret).length)}</b></div><div><span>مجموع خرید</span><b>${f0(mine.reduce((a,p)=>a+p.total,0))}</b></div></div>
      <button class="b sm" style="width:100%;background:#2E9E5B" data-buy="${s.id}">ثبت خرید از این فروشنده</button></article>`}).join("");
    if(!db.suppliers.length)h+='<div class="empty">هنوز فروشنده‌ای ثبت نشده.<br>با دکمه‌ی + اضافه‌ش کن.</div>';
  }else if(tab==="i"){
    const pl=people();$("sub").textContent=`${fa(pl.length)} نفر قسطی`;
    h=pl.map(ps=>`<article class="c h lnk" data-buyer="${esc(ps.name)}"><h2>${esc(ps.name)} ‹ ${ymKey(ps.due)<ymKey(today())?'<span class="bd" style="background:var(--warn)">عقب‌افتاده</span>':""}</h2>
      ${ps.plans.map(planBlock).join("")}
      <div class="st"><div><span>قسط ماهانه</span><b>${f0(ps.monthly)}</b></div><div><span>باقی‌مانده</span><b>${f0(ps.remain)}</b></div><div><span>سررسید</span><b>${fa(ps.due.slice(5))}</b></div></div>
      ${lateStr(ps.due)?`<p class="late">⚠ ${lateStr(ps.due)}</p>`:""}${payBlock(ps)}${contactBtns(ps)}</article>`).join("");
    if(!h)h='<div class="empty">الان کسی قسطی نداره.<br>موقع ثبت خریدار، «قسطی» رو انتخاب کن.</div>';
  }else if(tab==="f"){
    const pr=profitRows(),tot=totalProfit();
    $("sub").textContent="سود فروش کالاها";
    h=`<div class="c" style="text-align:center"><span style="color:var(--mut);font-size:.9rem">کل سودی که از فروش کالاها کردیم</span><div class="big" id="tp" style="${tot<0?"color:var(--warn)":""}">${tot>=0?"+":"−"}${f0(Math.abs(tot))}</div><span style="color:var(--mut)">تومان</span><div style="color:var(--mut);font-size:.85rem;margin-top:8px">نقدی ${sgn(profitSplit().c)} · قسطی (پرداخت‌شده) ${sgn(profitSplit().n)}</div></div>`
    +(pr.length?`<div class="c"><h2 style="padding:0;font-size:1rem">سود هر کالا</h2>${pr.map((r,i)=>`<div class="pr" style="--d:${i}"><span><b>${esc(r.name)}</b><small>قیمت اصلی: ${f0(r.cost)}${r.sold?" · "+fa(r.sold)+" فروش":""}</small></span><span class="pg2" style="${r.unit<0?"color:var(--warn)":""}">${r.unit>=0?"+":"−"}${f0(Math.abs(r.unit))}${r.sold?`<small>سود کل: ${r.profit>=0?"+":"−"}${f0(Math.abs(r.profit))}</small>`:""}</span></div>`).join("")}</div>`:'<div class="empty">هنوز کالایی ثبت نشده.</div>')
    +(db.orders.some(o=>o.inst)?`<div class="c"><h2 style="padding:0;font-size:1rem">قسطی‌ها</h2><p style="padding:0">فقط قسط‌هایی که پرداخت شده تو سود حساب می‌شه.</p>${db.orders.filter(o=>o.inst).map((o,i)=>{const pd=paidSum(o);return `<div class="pr" style="--d:${i};flex-wrap:wrap"><span><b>${esc(o.buyer||"بدون نام")}</b><small>${esc(o.items.map(x=>x.name).join("، "))} · ${fa(o.inst.months)} ماهه</small></span><span class="pg2" style="color:var(--ink);direction:rtl;text-align:left">${f0(pd)} از ${f0(o.total)} تومان<small>سود حساب‌شده: ${sgn(ordProfit(o)*ratio(o))}</small></span><div class="bt" style="flex-basis:100%"><i style="width:${o.total?pd/o.total*100:0}%"></i></div></div>`}).join("")}</div>`:"");
  }else if(tab==="m"){
    $("sub").textContent="آمار فروشنده‌ها و خریدارها";

  if(!to||matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=fmt(to);return}
  const t0=performance.now(),d=700;
  const step=t=>{const k=Math.min(1,(t-t0)/d);el.textContent=fmt(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

function toJpeg(file){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.85).split(",")[1])};im.onerror=()=>rej(new Error("عکس باز نشد"));im.src=u})}
async function aiExtract(file,kind){
  const data=await toJpeg(file);
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":db.ai.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:2500,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data}},{type:"text",text:kind==="inv"?INV_PROMPT:CARD_PROMPT}]}]})});
  if(!r.ok)throw new Error(r.status===401?"کلید اشتباهه":"خطای "+r.status);
  const j=await r.json(),t=(j.content||[]).filter(x=>x.type==="text").map(x=>x.text).join(""),m=t.match(/\{[\s\S]*\}/);
  if(!m)throw new Error("جواب نامعتبر بود");

}
function groupLines(its,cur){

    const price=x.unit_price?Math.round(x.unit_price/k10):0,key=nk(x.name)+"|"+price;
    const it=m.get(key)||{name:String(x.name||""),cat:"",code:"",unit:price?String(price):"",sell:"",rows:[]};
    let sz=String(x.size||"");if(/^[a-z]+$/i.test(sz))sz=sz.toUpperCase();
    it.rows.push({color:String(x.color||""),size:sz,qty:x.qty?String(x.qty):"",colorX:false,sizeX:false});m.set(key,it);
  });
  return [...m.values()];
}

}
function mergeInst(ps,N){
  const t0=today(),dues=ps.plans.map(dueOf).sort(),D=dues[0]<t0?t0:dues[0],lines=[];let tot=0;
  ps.plans.forEach(o=>{
    const R=remain(o),rec=paidSum(o),c=calcInst(R,N);
    o.prev={inst:{...o.inst},pre:o.pre||0};
    o.pre=Math.round(rec);o.merged=true;o.inst={months:N,monthly:c.monthly,last:c.last,paid:0,start:D};
    tot+=R;lines.push(`فاکتور ${fa(o.no||"")}: باقی‌مانده ${f0(R)} ← ماهی ${f0(c.monthly)}`);
  });
  log("mrg","یکی کردن قسط‌ها — "+ps.name,[...lines,`${fa(N)} ماه · اولین قسط ${fa(D)}`],tot);db.hist[0].buyer=ps.name;
  save();closeM();if(bv)openBuyer(bv.n,1);render();toast("قسط‌ها یکی شد ✓");
}
/* product photo */
let phIdx=null;
function shrink(file,max=420,q=.65){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",q))};
  im.onerror=()=>{URL.revokeObjectURL(url);rej()};im.src=url})}
$("pimg").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f||!cart||phIdx==null)return;
  let d;try{d=await shrink(f)}catch(x){return toast("عکس خونده نشد.")}
  if(!cart||!cart.items[phIdx])return;cart.items[phIdx].img=d;
  const st=$("pg").scrollTop;showCart();$("pg").scrollTop=st;
});
document.addEventListener("click",e=>{const im=e.target.closest("img.pi");if(im&&im.src)openM(`<img class="big" src="${im.src}" alt=""><div class="acts" style="margin-top:12px"><button class="b g" onclick="closeM()">بستن</button></div>`)});
/* app lock */
const LK="resta-lock",LF="resta-lockfail";
const lkGet=()=>{try{return JSON.parse(localStorage.getItem(LK)||"null")}catch(e){return null}};
const lkFail=()=>{try{return JSON.parse(localStorage.getItem(LF)||"")||{n:0,until:0}}catch(e){return{n:0,until:0}}};
function cyrb(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(16)}
async function hh(v,salt){const x=salt+"|"+v;if(window.crypto&&crypto.subtle){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(x));return[...new Uint8Array(b)].map(n=>n.toString(16).padStart(2,"0")).join("")}catch(e){}}return cyrb(x)}
const lkNorm=w=>nd(w).toLowerCase().replace(/\s+/g,"");
const lkSalt=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
function lkWait(){const f=lkFail();return f.until>Date.now()?`چند بار اشتباه زدی. ${Math.ceil((f.until-Date.now())/1000)} ثانیه صبر کن.`:""}
function lkBump(){const f=lkFail();f.n++;if(f.n>=5)f.until=Date.now()+30000*(f.n-4);localStorage.setItem(LF,JSON.stringify(f))}
let pad=null;
function padOpen(o,err){pad={...o,val:"",busy:false};padDraw(err);$("lk").classList.remove("out","ok");$("lk").classList.add("on")}
function padDraw(err){
  const o=pad;if(!o)return;
  const logo=(document.querySelector('link[rel="icon"]')||{}).href||"";
  $("lk").innerHTML=`<div class="lkc">${logo?`<img class="lkl" src="${logo}" alt="">`:'<div class="lki">🔒</div>'}<h2>${esc(o.unlock?(db.shop.name||"حسابداری رستا"):o.title)}</h2><p>${esc(o.unlock?"رمز ۴ رقمی رو وارد کن":(o.sub||""))}</p><div class="dots${err?" sh":""}">${[0,1,2,3].map(i=>`<i class="${i<o.val.length?"f":""}"></i>`).join("")}</div><div class="lke">${esc(err||"")}</div><div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<button data-k="x" class="sm">${o.cancel?"انصراف":""}</button><button data-k="0">0</button><button data-k="b" aria-label="پاک کردن">⌫</button></div>${o.forgot?'<button class="lkf" data-k="f">رمزم یادم رفته</button>':""}</div>`;
}
function padDots(err,pop){
  const l=$("lk"),d=l.querySelector(".dots"),e=l.querySelector(".lke");if(!d||!pad)return padDraw(err);
  d.innerHTML=[0,1,2,3].map(i=>`<i class="${i<pad.val.length?"f":""}${pop&&i===pad.val.length-1?" pop":""}"></i>`).join("");
  if(e)e.textContent=err||"";
  d.classList.remove("sh");if(err){void d.offsetWidth;d.classList.add("sh")}
}
function padOk(){
  const me=pad;if(!me)return;me.mode="ok";
  const l=$("lk"),lg=l.querySelector(".lkl,.lki"),h=l.querySelector("h2"),pp=l.querySelector(".lkc p");
  l.classList.add("ok");
  if(lg)lg.outerHTML='<svg class="ck" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="23" fill="none" stroke="#7CE0B0" stroke-width="3"/><path d="M15 27l8 8 14-16" fill="none" stroke="#7CE0B0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  if(h)h.textContent="خوش اومدی";if(pp)pp.textContent="در حال باز شدن…";
  setTimeout(()=>{if(pad===me){padClose(true);setTimeout(()=>l.classList.remove("ok"),260)}},850);
}
function padClose(anim){pad=null;const l=$("lk");if(anim){l.classList.add("out");setTimeout(()=>{if(!pad){l.classList.remove("on","out");l.innerHTML=""}},220)}else{l.classList.remove("on","out");l.innerHTML=""}}
async function padKey(k){
  const me=pad;if(!me||me.busy||me.mode)return;
  if(k==="x"){if(me.cancel)padClose();return}
  if(k==="f")return lkForgot();
  if(k==="b")me.val=me.val.slice(0,-1);else if(me.val.length<4){me.val+=k;navigator.vibrate&&navigator.vibrate(8)}
  padDots(null,k!=="b");
  if(me.val.length===4){me.busy=true;const msg=await me.done(me.val);if(pad===me){me.busy=false;if(msg){me.val="";padDots(msg);navigator.vibrate&&navigator.vibrate([40,40,40])}}}
}
async function lkCheck(pin){
  const L=lkGet();if(!L)return true;
  const w=lkWait();if(w)return w;
  if(await hh(pin,L.s)===L.h){localStorage.removeItem(LF);return true}
  lkBump();return lkWait()||"رمز اشتباهه.";
}
function showLock(){
  if(!lkGet()||(pad&&pad.unlock))return;
  padOpen({title:"قفل برنامه",sub:"رمز ۴ رقمی رو وارد کن",forgot:true,unlock:true,done:async v=>{const r=await lkCheck(v);if(r===true){padOk();return}return r}});
}
function lkVerify(then){
  padOpen({title:"رمز فعلی",sub:"برای ادامه رمز رو وارد کن",cancel:true,done:async v=>{const r=await lkCheck(v);if(r===true){padClose();then();return}return r}});
}
function lkSet(cb,err){
  padOpen({title:"رمز جدید",sub:"یه رمز ۴ رقمی انتخاب کن",cancel:true,done:v1=>{
    padOpen({title:"تکرار رمز",sub:"رمز رو دوباره وارد کن",cancel:true,done:async v2=>{
      if(v2!==v1){lkSet(cb,"رمزها یکی نبود. از اول بزن.");return}
      padClose();await cb(v1);
    }});
  }},err);
}
function lkForgot(){
  pad.mode="forgot";
  $("lk").innerHTML=`<div class="lkc"><div class="lki">🔑</div><h2>بازیابی قفل</h2><p>کلمه‌ای که موقع فعال کردن قفل نوشتی رو بنویس.</p><input id="lkw" class="lkin" autocomplete="off"><div class="lke" id="lkwe"></div><div class="acts" style="width:100%"><button class="b g" id="lkwb" style="background:rgba(255,255,255,.14);color:#fff">برگشت</button><button class="b" id="lkwo">باز کن</button></div></div>`;
  $("lkwb").onclick=()=>{pad.mode=null;padDraw()};
  $("lkwo").onclick=async()=>{
    const L=lkGet(),e=t=>{$("lkwe").textContent=t},w=lkWait();if(w)return e(w);
    if(L&&await hh(lkNorm($("lkw").value),L.s)===L.r){localStorage.removeItem(LK);localStorage.removeItem(LF);padClose(true);toast("قفل غیرفعال شد. از تنظیمات دوباره فعالش کن.")}
    else{lkBump();e(lkWait()||"کلمه درست نیست.")}
  };
  $("lkw").focus();
}
function lkRecovery(pin){
  openM(`<h3>کلمه‌ی بازیابی</h3><p style="color:var(--mut);line-height:1.9">اگه رمز یادت رفت، با این کلمه می‌تونی قفل رو باز کنی. یه کلمه یا جمله‌ی کوتاه بنویس که یادت بمونه و جایی هم یادداشتش کن.</p><input id="lkr" autocomplete="off" placeholder="مثلاً اسم دخترم"><p class="err" id="lkre"></p><div class="acts"><button class="b g" onclick="closeM()">انصراف</button><button class="b" id="lkrs">فعال کن</button></div>`);
  $("lkrs").onclick=async()=>{
    const w=lkNorm($("lkr").value);if(w.length<3)return $("lkre").textContent="حداقل ۳ حرف بنویس.";
    const sl=lkSalt();localStorage.setItem(LK,JSON.stringify({s:sl,h:await hh(pin,sl),r:await hh(w,sl)}));localStorage.removeItem(LF);
    closeM();toast("قفل فعال شد ✓");
  };
}
$("lk").addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(b)padKey(b.dataset.k)});
$("lk").addEventListener("pointerdown",e=>{
  const b=e.target.closest(".keys button");if(!b||!b.textContent.trim())return;
  const r=b.getBoundingClientRect(),sp=document.createElement("span");sp.className="rp";sp.style.left=(e.clientX-r.left)+"px";sp.style.top=(e.clientY-r.top)+"px";b.appendChild(sp);setTimeout(()=>sp.remove(),520);
});
document.addEventListener("keydown",e=>{if(!pad||!$("lk").classList.contains("on")||e.target.tagName==="INPUT")return;if(/^\d$/.test(e.key))padKey(e.key);else if(e.key==="Backspace")padKey("b")});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-lk]");if(!b)return;closeM();const a=b.dataset.lk;
  if(a==="on")lkSet(lkRecovery);
  else if(a==="off")lkVerify(()=>{localStorage.removeItem(LK);localStorage.removeItem(LF);toast("قفل غیرفعال شد")});
  else lkVerify(()=>lkSet(async pin=>{const L=lkGet();L.h=await hh(pin,L.s);localStorage.setItem(LK,JSON.stringify(L));toast("رمز عوض شد ✓")}));
});
let hiddenAt=0;
document.addEventListener("visibilitychange",()=>{if(document.hidden)hiddenAt=Date.now();else if(lkGet()&&hiddenAt&&Date.now()-hiddenAt>60000)showLock()});
document.addEventListener("click",e=>{if(e.target.closest("[data-sr0]")){closeDrawer();openSr()}});
applyTheme();
showLock();
render();
autoSnap();
</script>
