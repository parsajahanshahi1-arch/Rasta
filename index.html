<title>حسابداری رستا</title>
<style>
:root{--bg:#FBF3F6;--card:#fff;--plum:#4E2342;--pt:#4E2342;--rose:#C2557A;--blush:#F6E3EA;--ink:#2A1A24;--mut:#7d6672;--warn:#B3261E;--ok:#2E7D5B;--font:"Vazirmatn",Tahoma,"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,a,.lnk,select{touch-action:manipulation}
button{-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
body{overscroll-behavior-y:none;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);padding-bottom:160px}
header{position:relative;background:var(--plum);color:#fff;padding:20px 20px 18px;border-radius:0 0 26px 26px}
header h1{margin:0;font-size:1.35rem}header p{margin:4px 0 0;opacity:.8;font-size:.9rem}
.hm{position:absolute;left:14px;top:16px;width:44px;height:44px;border:0;border-radius:14px;background:rgba(255,255,255,.14);color:#fff;font-size:1.5rem;cursor:pointer}
main{padding:16px;display:grid;gap:12px;max-width:640px;margin:0 auto}
.srch{display:none;max-width:640px;margin:14px auto 0;padding:0 16px}.srch.on{display:block}
.sf{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:0 14px;box-shadow:0 2px 10px rgba(78,35,66,.07)}
.sf input{background:none;border:0;margin:0;padding:13px 4px}
.empty{background:var(--card);border-radius:20px;padding:26px 20px;color:var(--mut);text-align:center;line-height:1.9}
.c{position:relative;background:var(--card);border-radius:20px;padding:16px;box-shadow:0 2px 10px rgba(78,35,66,.07)}
.c h2{margin:0;font-size:1.1rem;padding-right:42px;overflow-wrap:anywhere}
.c p{margin:4px 0 0;color:var(--mut);font-size:.9rem;padding-right:42px}
.h h2,.h p{padding-right:0}
.c a{color:var(--rose);text-decoration:none;font-weight:700}
.x{position:absolute;top:12px;right:12px;width:34px;height:34px;border:0;border-radius:50%;background:var(--blush);color:var(--pt);font-size:1.2rem;cursor:pointer}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.st div{background:var(--blush);border-radius:14px;padding:9px 6px;text-align:center}
.st span{display:block;font-size:.75rem;color:var(--mut)}.st b{font-size:.98rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips i{font-style:normal;background:var(--blush);border-radius:20px;padding:4px 10px;font-size:.82rem}
.ch{border:0;border-radius:20px;padding:7px 14px;font:inherit;font-size:.88rem;background:var(--blush);color:var(--pt);cursor:pointer}
.ch.on{background:var(--plum);color:#fff}
.tg{display:inline-block;border-radius:20px;padding:3px 12px;font-size:.88rem;color:#fff;background:var(--plum)}
.tg.add{background:var(--rose)}.tg.sale{background:var(--ok)}.tg.pay{background:#6B5BD6}.tg.ret{background:#D9822B}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);padding:8px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(78,35,66,.1);z-index:4}
.nav button{flex:1;border:0;background:none;font:inherit;padding:12px 2px;border-radius:16px;font-size:.84rem;color:var(--mut);cursor:pointer}
.nav button.on{background:var(--blush);color:var(--pt);font-weight:700}
.fab{position:fixed;right:20px;bottom:88px;width:64px;height:64px;border:0;border-radius:50%;background:var(--rose);color:#fff;font-size:2.1rem;box-shadow:0 8px 22px rgba(194,85,122,.45);cursor:pointer;z-index:4}
.ov{position:fixed;inset:0;background:rgba(30,10,24,.6);display:none;align-items:flex-end;justify-content:center;z-index:8}
.ov.open{display:flex}
.m{background:var(--card);width:100%;max-width:520px;max-height:94vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
.m h3{margin:0 0 4px;font-size:1.2rem}
label{display:block;font-weight:700;font-size:.9rem;margin:12px 0 5px}
input,select{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border:2px solid transparent;border-radius:14px;background:var(--blush);color:var(--ink);margin-top:8px}
input:focus,select:focus{border-color:var(--rose);outline:none}
label+input,label+select{margin-top:0}
.n{direction:ltr;text-align:center}
.hint{display:block;min-height:1.2em;margin:4px 2px 0;color:var(--rose);font-size:.85rem;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rw{display:grid;grid-template-columns:1.2fr 1fr .8fr 38px;gap:6px;align-items:center}
.rw input{padding:11px 8px}

<script>
const $=i=>document.getElementById(i);
const P="۰۱۲۳۴۵۶۷۸۹";
let db={suppliers:[],products:[],purchases:[],hist:[],orders:[]},tab="p",cart=null,rs=null,bv=null,iv=null,sv=null,scanKind="",stTab="s",stKind="c",kq="",lastTab=null,fxNext=false,mt=0,et=0,askEl=null;

db.shop=db.shop||{name:"رستا",phone:"",addr:""};db.seq=db.seq||0;db.part=db.part||{};

mq.addEventListener&&mq.addEventListener("change",applyTheme);
db.orders.slice().reverse().forEach(o=>{if(!o.no)o.no=++db.seq});
const nd=s=>String(s).replace(/[۰-۹]/g,d=>P.indexOf(d));
const fa=s=>String(s);
const num=s=>{s=nd(s).replace(/[,٬\s]/g,"").replace("٫",".");return s===""?NaN:Number(s)};
const money=n=>Math.round(n).toLocaleString("en-US")+" تومان";
const f0=n=>Math.round(n).toLocaleString("en-US");

function short(v){const n=Math.round(num(String(v)));if(!isFinite(n)||n<=0)return"";const m=Math.floor(n/1e6),k=Math.floor(n%1e6/1e3),r=n%1e3,p=[];if(m)p.push(fa(m)+" میلیون");if(k)p.push(fa(k)+" هزار");if(r)p.push(fa(r));return p.join(" و ")+" تومان"}
function toJ(gy,gm,gd){
  const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];
  let jy=gy<=1600?0:979;gy-=gy<=1600?621:1600;
  const gy2=gm>2?gy+1:gy;
  let days=365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+gdm[gm-1];
  jy+=33*Math.floor(days/12053);days%=12053;
  jy+=4*Math.floor(days/1461);days%=1461;
  if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}
  const jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30);
  const jd=1+(days<186?days%31:(days-186)%30);
  return [jy,jm,jd];
}
function today(){const d=new Date(),j=toJ(d.getFullYear(),d.getMonth()+1,d.getDate());return `${j[0]}/${String(j[1]).padStart(2,"0")}/${String(j[2]).padStart(2,"0")}`}
function addM(d,k){let [y,m,dd]=nd(d).split("/").map(Number);m+=k;y+=Math.floor((m-1)/12);m=(m-1)%12+1;dd=Math.min(dd,m<=6?31:m<=11?30:29);return `${y}/${String(m).padStart(2,"0")}/${String(dd).padStart(2,"0")}`}
const ymKey=d=>d.slice(0,7);
function toG(jy,jm,jd){
  jy+=1595;
  let days=-355668+365*jy+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);
  let gy=400*Math.floor(days/146097);days%=146097;
  if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++}
  gy+=4*Math.floor(days/1461);days%=1461;
  if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}
  let gd=days+1;
  const sal=[0,31,(gy%4===0&&gy%100!==0)||gy%400===0?29:28,31,30,31,30,31,31,30,31,30,31];

function daysLate(due){
  const [y,m,d]=nd(due).split("/").map(Number),[gy,gm,gd]=toG(y,m,d),n=new Date();

function lateStr(due){
  const d=daysLate(due);if(d<=0)return"";
  const t=d<30?`${fa(d)} روز`:`${fa(Math.floor(d/30))} ماه${d%30?" و "+fa(d%30)+" روز":""}`;
  return `از روز پرداخت قسط ${t} گذشته و پرداخت نشده`;
}

/* installments */
function rnd(n){const st=n<100000?1000:n<10000000?10000:100000;return Math.round(n/st)*st}
function calcInst(total,m){if(m===1)return{monthly:total,last:total};let mo=rnd(total/m);if(mo<=0||mo*(m-1)>=total)mo=Math.floor(total/m);return{monthly:mo,last:total-mo*(m-1)}}
const act=o=>o.inst&&o.inst.paid<o.inst.months;
const dueOf=o=>addM(o.inst.start,o.inst.paid);
const instAmt=(o,n)=>n>=o.inst.months?o.inst.last:o.inst.monthly;
const remain=o=>{let r=0;for(let n=o.inst.paid+1;n<=o.inst.months;n++)r+=instAmt(o,n);return r};
const paidSum=o=>!o.inst?o.total:(o.inst.paid>=o.inst.months?o.total:o.inst.monthly*o.inst.paid);
const ratio=o=>o.total>0?paidSum(o)/o.total:1;
const ordProfit=o=>o.items.reduce((a,i)=>a+(i.price-(i.cost??i.price))*i.qty,0);
const sgn=v=>(v>=0?"+":"−")+f0(Math.abs(v));
function profitSplit(){let c=0,n=0;db.orders.forEach(o=>{const p=ordProfit(o)*ratio(o);o.inst?n+=p:c+=p});return{c,n}}

  const m=new Map();
  db.orders.filter(act).forEach(o=>{const k=nk(o.buyer),p=m.get(k)||{key:k,name:o.buyer||"بدون نام",plans:[]};p.plans.push(o);m.set(k,p)});

const INV_PROMPT='You are reading a photo of a purchase invoice (usually Persian) from a clothing supplier. Answer with ONLY a JSON object and no other text: {"supplier": string or null, "currency": "toman" or "rial" or "unknown", "items": [{"name": string, "color": string or null, "size": string or null, "qty": number, "unit_price": number or null}]}. Rules: keep names and colors in Persian as written; convert Persian digits to ASCII digits; unit_price is the price of ONE piece (if only a line total is printed, divide by qty); one entry per distinct name+color+size; never invent items; use null when unsure.';
const CARD_PROMPT='You are reading a photo of a business card of a clothing supplier (usually Persian). Answer with ONLY a JSON object and no other text: {"name": string or null, "person": string or null, "phone": string or null, "address": string or null, "instagram": string or null, "telegram": string or null, "website": string or null}. Keep Persian text as written and convert Persian digits in phone numbers to ASCII digits. Use null when a field is missing.';
function toJpeg(file){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.85).split(",")[1])};im.onerror=()=>rej(new Error("عکس باز نشد"));im.src=u})}
async function aiExtract(file,kind){
  const data=await toJpeg(file);
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":db.ai.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:2500,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data}},{type:"text",text:kind==="inv"?INV_PROMPT:CARD_PROMPT}]}]})});
  if(!r.ok)throw new Error(r.status===401?"کلید اشتباهه":"خطای "+r.status);
  const j=await r.json(),t=(j.content||[]).filter(x=>x.type==="text").map(x=>x.text).join(""),m=t.match(/\{[\s\S]*\}/);
  if(!m)throw new Error("جواب نامعتبر بود");
  return JSON.parse(m[0]);
}
function groupLines(its,cur){
  const m=new Map(),k10=cur==="rial"?10:1;
  (its||[]).forEach(x=>{
    const price=x.unit_price?Math.round(x.unit_price/k10):0,key=nk(x.name)+"|"+price;
    const it=m.get(key)||{name:String(x.name||""),cat:"",code:"",unit:price?String(price):"",sell:"",rows:[]};
    let sz=String(x.size||"");if(/^[a-z]+$/i.test(sz))sz=sz.toUpperCase();
    it.rows.push({color:String(x.color||""),size:sz,qty:x.qty?String(x.qty):"",colorX:false,sizeX:false});m.set(key,it);
  });
  return [...m.values()];
}

function commitSale(sel,date,buyer,months,phone){

    const pr=sellOf(o.p);o.p.sold=(o.p.sold||0)+q;total+=pr*q;

    lines.push(`${o.p.name} — ${rows.map(r=>vl(r)+" "+fa(r.qty)).join("، ")}`);
  });

  if(months){const c=calcInst(total,months);o.inst={months,monthly:c.monthly,last:c.last,paid:0,start:date}}

  log("sale",(months?"فروش قسطی به ":"فروش به ")+buyer,lines,total,date);db.hist[0].id=id;db.hist[0].buyer=buyer;
  save();render();
}

function commit(items,mode,sup,date0,supTxt){
  const lines=[],pi=[];let total=0;
  items.forEach(it=>{
    let p=db.products.find(x=>x.name.toLowerCase()===it.name.toLowerCase()),isNew=false;
    if(!p){isNew=true;p={id:Date.now()+Math.random(),name:it.name,cat:"",code:"",buy:0,variants:[],bought:0,sold:0};db.products.unshift(p)}
    if(it.cat)p.cat=it.cat;if(it.code)p.code=it.code;p.buy=it.unit;
    if(isFinite(it.sell)){p.sell=it.sell;p.noProfit=false}else if(isNew){p.sell=null;p.noProfit=true}

  const o=db.orders.find(x=>x.id===iv.id);if(!o)return;const t=invText(o);
  if(a==="print")return window.print();
  if(a==="share"&&navigator.share)return navigator.share({text:t}).catch(()=>{});
  copyT(t);
}
/* menu */
function openDrawer(){
  const n=people().length;
  $("dw").innerHTML=`<h3>منو</h3><button data-go="i"><span>👥 افراد قسطی</span>${n?`<span class="bd">${fa(n)}</span>`:""}</button><button data-go="f">💰 سود</button><button data-go="p">🏠 خانه</button><button data-go="k">👗 کالاها</button><button data-go="s">🏬 فروشنده‌ها</button><button data-go="h">🕘 هیستوری</button><button data-go="m">📊 آمار</button><button data-go="set">⚙️ تنظیمات</button>`;
  $("dw").querySelectorAll("button").forEach((b,i)=>b.style.setProperty("--d",i));$("dw").classList.add("open");$("dwo").classList.add("open");
}
const closeDrawer=()=>{$("dw").classList.remove("open");$("dwo").classList.remove("open")};
/* events */
document.addEventListener("input",e=>{
  const t=e.target;if(!t.classList)return;
  if(t.classList.contains("bad"))t.classList.remove("bad");
  if(t.classList.contains("mny")){const raw=nd(t.value),h=t.nextElementSibling;if(/[%٪]/.test(raw)){const d=raw.replace(/[^\d.]/g,"");t.value=(d?fa(d):"")+"%";if(h&&h.classList.contains("hint"))h.textContent=""}else{const r=raw.replace(/\D/g,"");t.value=r?fa(Number(r).toLocaleString("en-US")):"";if(h&&h.classList.contains("hint"))h.textContent=short(t.value)}}
  if(t.classList.contains("nmi"))refreshNames(t);
},true);
$("bell").onclick=openBell;
$("scan").onclick=()=>openM('<h3>اسکن با دوربین</h3><p style="color:var(--mut);margin:4px 0 12px">چی رو می‌خوای عکس بگیری؟</p><button class="b" style="width:100%;margin-bottom:10px" data-scan="card">🏷️ کارت فروشنده</button><button class="b" style="width:100%;background:#2E9E5B" data-scan="inv">🧾 فاکتور خرید</button><div class="acts" style="margin-top:12px"><button class="b g" onclick="closeM()">بستن</button></div>');
$("cam").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(f)handleScan(f)});
$("rf").addEventListener("change",e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  f.text().then(t=>{
    let d;try{d=JSON.parse(t)}catch(x){}
    if(!d||!Array.isArray(d.orders)||!Array.isArray(d.products))return tell("این فایل پشتیبان رستا نیست.");
    openM(`<h3>بازیابی اطلاعات</h3><p style="color:var(--mut)">اطلاعات فعلی با فایل پشتیبان جایگزین می‌شود. ادامه می‌دی؟</p><div class="acts" style="margin-top:12px"><button class="b g" onclick="closeM()">نه</button><button class="b" id="rsy">بله، بازیابی کن</button></div>`);
    $("rsy").onclick=()=>{localStorage.setItem("resta",JSON.stringify(d));location.reload()};
  });
});
document.addEventListener("click",e=>{
  if(e.target.closest("[data-bk]")){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:"application/json"}));a.download="resta-backup-"+today().replace(/\//g,"-")+".json";document.body.appendChild(a);a.click();a.remove();toast("نسخه‌ی پشتیبان ذخیره شد ✓");return}
  if(e.target.closest("[data-rs]")){$("rf").click();return}
  if(e.target.closest("[data-inst]")){if(deferredInstall){deferredInstall.prompt();deferredInstall=null;closeM()}return}
  const th=e.target.closest("[data-th]");if(th){db.theme=th.dataset.th;save();applyTheme();th.parentNode.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===th));return}
  const sc=e.target.closest("[data-scan]");if(sc){scanKind=sc.dataset.scan;closeM();$("cam").click();return}
  const mb=e.target.closest("#m [data-buyer]");if(mb){closeM();openBuyer(mb.dataset.buyer);return}
  const fo=e.target.closest("[data-focus]");if(fo){$(fo.dataset.focus).focus();return}
  const n=e.target.closest("[data-nm]");
  if(n){const w=n.closest(".nmw"),i=w.querySelector(".nmi"),pi=w.querySelector(".phi"),ph=phoneOf(n.dataset.nm);i.value=n.dataset.nm;i.dispatchEvent(new Event("input",{bubbles:true}));if(pi&&ph){pi.value=ph;pi.dispatchEvent(new Event("input",{bubbles:true}))}return}
  const g=e.target.closest("[data-go]");if(g){if(g.dataset.go==="set"){closeDrawer();openShop();return}tab=g.dataset.go;closeDrawer();render();window.scrollTo(0,0)}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeM();closeDrawer()}});
$("hm").onclick=openDrawer;$("dwo").onclick=closeDrawer;
$("ks").addEventListener("input",e=>{kq=e.target.value;render()});
$("pg").addEventListener("input",e=>{
  if(cart){
    if(e.target.tagName==="SELECT")return;
    if(e.target.id==="cd"){cart.date=e.target.value;return}
    const d=e.target.dataset;if(d.i===undefined)return;
    const it=cart.items[+d.i];d.r!==undefined?it.rows[+d.r][d.f]=e.target.value:it[d.f]=e.target.value;sums();
  }else if(rs){
    if(e.target.id==="rn")rs.name=e.target.value;
    else if(e.target.id==="rnp")rs.phone=e.target.value;
    else if(e.target.id==="rsq"){rs.q=e.target.value;rsFilter()}
  }
});
$("pg").addEventListener("change",e=>{
  const t=e.target;
  if(cart&&t.dataset.sel){
    const d=t.dataset,r=cart.items[+d.i].rows[+d.r],v=t.value;
    if(v==="__x"){r[d.f+"X"]=true;r[d.f]=""}else{r[d.f]=v;r[d.f+"X"]=false}
    showCart();
    if(v==="__x"){const x=document.querySelector(`#pg input.cin[data-i="${d.i}"][data-r="${d.r}"][data-f="${d.f}"]`);if(x)x.focus()}
  }else if(cart&&t.id==="scs"){cart.sup=t.value?+t.value:null;showCart()}
  else if(cart&&t.dataset.pick!==undefined){
    const it=cart.items[+t.dataset.pick],p=db.products.find(x=>String(x.id)===t.value);
    if(p){it.name=p.name;it.cat=p.cat||"";it.code=p.code||"";it.unit=String(p.buy||"");it.sell=p.noProfit?"":String(sellOf(p))}showCart();
  }
});
$("pg").addEventListener("click",e=>{
  const T=q=>e.target.closest(q);
  const inv=T("[data-inv]");if(inv)return openInvoice(+inv.dataset.inv);
  const ia=T("[data-iv]");if(ia&&iv)return invAct(ia.dataset.iv);
  const be=T("[data-be]");if(be&&bv)return buyerEdit(bv.n);
  const sb=T("[data-sbuy]");if(sb)return openCart("buy",+sb.dataset.sbuy);
  const se=T("[data-sedit]");if(se)return supForm(+se.dataset.sedit);
  const rt0=T("[data-ret]");if(rt0&&bv)return openRet(+rt0.dataset.ret);
  const dO=T("[data-delo]");
  if(dO&&bv){const nm=bv.n,key=nk(nm),id=+dO.dataset.delo;return ask("این خرید حذف بشه؟ کالاها به انبار برمی‌گردن.",()=>{delOrder(id);if(db.orders.some(o=>nk(o.buyer)===key))setTimeout(()=>openBuyer(nm),0);else closeCart()})}
  const pay=T("[data-pay]");
  if(pay&&bv){payMonth(pay.dataset.pay);openBuyer(bv.n,1);render();return}
  const rc=T("[data-rc]");
  if(rc&&bv){const v=num($("pa").value);if(!(v>0))return tell("مبلغ رو بنویس.");addReceipt(nk(bv.n),v);openBuyer(bv.n,1);render();return}
  const rd=T("[data-rd]");
  if(rd&&bv){const key=nk(bv.n),p=db.part[key],en=p&&p.list[+rd.dataset.rd];if(en){p.amt=Math.max(0,p.amt-en.a);p.list.splice(+rd.dataset.rd,1);db.hist=db.hist.filter(h=>h.id!==en.h);save();openBuyer(bv.n,1);render()}return}
  const b=T("[data-a]");if(!b)return;
  const a=b.dataset.a,i=+b.dataset.i,r=+b.dataset.r,k=+b.dataset.k;
  if(a==="bk"){if(iv&&iv.from!=null){const n=iv.from;iv=null;return openBuyer(n)}return closeCart()}
  if(cart){
    if(a==="sv")return saveCart();
    if(a==="ar")cart.items[i].rows.push(newRow());
    else if(a==="dr"){const rs2=cart.items[i].rows;if(rs2.length>1)rs2.splice(r,1)}
    else if(a==="ai")cart.items.push(newItem());
    else if(a==="di")cart.items.splice(i,1);
    else if(a==="cat")cart.items[i].cat=b.dataset.v;
    else if(a==="cl"){const row=cart.items[i].rows[r];row[b.dataset.f]="";row[b.dataset.f+"X"]=false}
    showCart();
  }else if(rs){
    if(a==="sv")return saveRs();
    if(a==="pt"){rs.pt=b.dataset.v;if(rs.pt!=="i")rs.months=0;rs.pulse="t"}
    else if(a==="mo"){rs.months=+b.dataset.v;rs.pulse="t"}
    else{const it=rs.items[i],p=db.products.find(x=>x.id===it.pid);rs.pulse=i+"-"+k;
      if(a==="p")it.q[k]=Math.min(p.variants[k].qty,it.q[k]+1);else if(a==="m")it.q[k]=Math.max(0,it.q[k]-1)}
    showRs();
  }
});
$("add").onclick=()=>tab==="s"?supForm():openRs();
$("ov").addEventListener("click",e=>{if(e.target===$("ov"))closeM()});
document.querySelector(".nav").addEventListener("click",e=>{const b=e.target.closest("button");if(b){tab=b.dataset.t;render();window.scrollTo(0,0)}});
$("list").addEventListener("click",e=>{
  if(e.target.closest("a"))return;
  const ib=e.target.closest("[data-inv]");if(ib)return openInvoice(+ib.dataset.inv);
  const ed=e.target.closest("[data-edit]");if(ed)return ed.dataset.edit==="k"?openEdit(+ed.dataset.id):supForm(+ed.dataset.id);
  const bb=e.target.closest("[data-buy]");if(bb)return openCart("buy",+bb.dataset.buy);
  const ag=e.target.closest("[data-again]");if(ag)return openRs(ag.dataset.again,phoneOf(ag.dataset.again));
  const sb=e.target.closest("[data-sale]");if(sb)return saleForm(+sb.dataset.sale);
  if(e.target.closest("[data-new]"))return openRs();
  const stb=e.target.closest("[data-st]");if(stb){stTab=stb.dataset.st;return render()}
  const skb=e.target.closest("[data-sk]");if(skb){stKind=skb.dataset.sk;return render()}
  const pay=e.target.closest("[data-pay]");if(pay){payMonth(pay.dataset.pay);return render()}
  const b=e.target.closest(".x");
  if(!b){const cb=e.target.closest("[data-buyer]");if(cb)return openBuyer(cb.dataset.buyer);const sp=e.target.closest("[data-supp]");if(sp)openSupplier(+sp.dataset.supp);return}
  const id=+b.dataset.id,k=b.dataset.del;askEl=b.closest("article");
  if(k==="s"){
    ask(db.purchases.some(p=>p.sup===id)?"این فروشنده حذف بشه؟ خریدهاش تو هیستوری می‌مونن.":"این فروشنده حذف بشه؟",()=>{
      const n=supName(id);db.purchases.forEach(p=>{if(p.sup===id){p.supName=n;p.sup=null}});
      db.suppliers=db.suppliers.filter(s=>s.id!==id)});
  }else if(k==="o")ask("این خرید حذف بشه؟ کالاها به انبار برمی‌گردن.",()=>{
    const o=db.orders.find(x=>x.id===id);
    if(o)o.items.forEach(i=>{const p=db.products.find(x=>x.id===i.pid);if(!p)return;i.rows.forEach(r=>{const v=p.variants.find(x=>x.color===r.color&&x.size===r.size);v?v.qty+=r.qty:p.variants.push({color:r.color,size:r.size,qty:r.qty});p.sold=Math.max(0,(p.sold||0)-r.qty)})});
    db.orders=db.orders.filter(x=>x.id!==id);db.hist=db.hist.filter(h=>h.id!==id)});
  else if(k==="h")ask("این مورد از هیستوری حذف بشه؟ موجودی انبار تغییر نمی‌کنه.",()=>{db.hist=db.hist.filter(h=>h.id!==id)});
  else ask("این کالا از انبار حذف بشه؟",()=>{db.products=db.products.filter(p=>p.id!==id)});
});
applyTheme();
render();
</script>
